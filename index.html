<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel/CSV Dual Live Search</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</head>
<body class="bg-gray-50 min-h-screen py-8 px-4 font-sans text-gray-800">

    <div class="max-w-[1600px] mx-auto bg-white rounded-xl shadow-md p-6">
    <div class="fixed top-4 right-4 text-right z-50">
        <p class="text-sm font-bold text-gray-700">Glen Rajadurai</p>
        <a href="mailto:glenrajadurai24@gmail.com" class="text-xs text-indigo-600 hover:underline">glenrajadurai24@gmail.com</a>
    </div>
        <h1 class="text-3xl font-bold text-gray-900 mb-6 text-center">Excel & CSV Dual Live Search</h1>
        
        <div class="max-w-xl mx-auto mb-8">
            <label class="block text-sm font-semibold text-gray-700 mb-2 text-center">Global Live Search (Searches both files simultaneously)</label>
            <div class="relative flex items-center">
                <input type="text" id="searchInput" placeholder="Upload files to start searching..." disabled
                       class="w-full border-2 border-gray-300 rounded-lg pl-10 pr-10 py-2.5 bg-gray-100 cursor-not-allowed focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 focus:outline-none transition-all text-center font-medium shadow-sm">
                <svg class="w-5 h-5 text-gray-400 absolute left-3 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
                <button id="clearSearchBtn" type="button" class="hidden absolute right-3 text-gray-400 hover:text-gray-600 focus:outline-none p-1 rounded-full hover:bg-gray-100" title="Clear search">
                    <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"></path>
                    </svg>
                </button>
            </div>
            <div class="flex items-center justify-center gap-4 mt-2 text-xs text-gray-500">
                <label class="inline-flex items-center gap-1.5 cursor-pointer">
                    <input type="checkbox" id="searchAllColsCheckbox" class="rounded text-indigo-600 focus:ring-indigo-500">
                    <span>Search all columns (instead of targeted columns)</span>
                </label>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 items-start">
            
            <div class="border border-gray-200 rounded-xl p-5 bg-gray-50/50">
                <h2 class="text-lg font-bold text-gray-800 mb-4 pb-2 border-b border-gray-200">File 1: Original Search (Column 1)</h2>
                
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Upload File 1 (.xls, .xlsx, .csv)</label>
                    <input type="file" id="fileInput" accept=".xls,.xlsx,.csv" 
                           class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 border border-gray-300 rounded-md p-1 bg-white">
                </div>

                <div class="flex justify-between items-center mb-4 text-sm font-medium">
                    <span id="statusMessage" class="text-gray-500">Please upload File 1.</span>
                    <span id="matchCount" class="text-indigo-600 hidden">Matches found: 0</span>
                </div>

                <div class="overflow-x-auto border border-gray-200 rounded-lg hidden bg-white" id="tableContainer">
                    <table class="w-full table-fixed divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr id="tableHeader"></tr>
                        </thead>
                        <tbody id="tableBody" class="bg-white divide-y divide-gray-200 text-xs md:text-sm"></tbody>
                    </table>
                </div>
            </div>

            <div class="border border-gray-200 rounded-xl p-5 bg-gray-50/50">
                <h2 class="text-lg font-bold text-gray-800 mb-4 pb-2 border-b border-gray-200">File 2: Targeted Search (Columns 3 & 4)</h2>
                
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Upload File 2 (.xls, .xlsx, .csv)</label>
                    <input type="file" id="fileInput2" accept=".xls,.xlsx,.csv" 
                           class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100 border border-gray-300 rounded-md p-1 bg-white">
                </div>

                <div id="tabSelectionContainer" class="mb-4 hidden">
                    <div class="flex items-center justify-between mb-2">
                        <label class="block text-sm font-semibold text-gray-700">Select Tabs to Search:</label>
                        <div class="flex gap-2 text-xs">
                            <button type="button" id="selectAllTabsBtn" class="text-indigo-600 hover:text-indigo-800 font-medium">Select All</button>
                            <span class="text-gray-300">|</span>
                            <button type="button" id="deselectAllTabsBtn" class="text-gray-500 hover:text-gray-700 font-medium">Deselect All</button>
                        </div>
                    </div>
                    <div id="tabCheckboxes" class="flex flex-wrap gap-3 p-3 bg-white border border-gray-200 rounded-lg max-h-32 overflow-y-auto">
                    </div>
                </div>

                <div class="flex justify-between items-center mb-4 text-sm font-medium">
                    <span id="statusMessage2" class="text-gray-500">Please upload File 2.</span>
                </div>

                <div id="file2ResultsContainer" class="space-y-6 hidden">
                </div>
            </div>

        </div>
    </div>

    <script>
        let fileData1 = []; 
        let fileWorkbook2 = null; 
        let searchTimeout = null;
        let cachedSheets2 = {};

        const searchInput = document.getElementById('searchInput');
        const fileInput = document.getElementById('fileInput');
        const statusMessage = document.getElementById('statusMessage');
        const matchCount = document.getElementById('matchCount');
        const tableContainer = document.getElementById('tableContainer');
        const tableHeader = document.getElementById('tableHeader');
        const tableBody = document.getElementById('tableBody');

        const fileInput2 = document.getElementById('fileInput2');
        const statusMessage2 = document.getElementById('statusMessage2');
        const tabSelectionContainer = document.getElementById('tabSelectionContainer');
        const tabCheckboxes = document.getElementById('tabCheckboxes');
        const file2ResultsContainer = document.getElementById('file2ResultsContainer');

        function updateSearchInputStatus() {
            if (fileData1.length > 0 || fileWorkbook2) {
                searchInput.disabled = false;
                searchInput.classList.remove('bg-gray-100', 'cursor-not-allowed');
                searchInput.placeholder = "Type to search all criteria...";
            }
        }

        function processParsedData1(rows, fileName) {
            // Filter out trailing completely empty rows
            fileData1 = rows.filter(r => r && Array.isArray(r) && r.some(c => c !== null && c !== undefined && String(c).trim() !== ""));

            if (!fileData1 || fileData1.length === 0) {
                statusMessage.textContent = "The file appears to be empty.";
                return;
            }

            statusMessage.textContent = `Loaded: ${fileName}`;
            tableContainer.classList.remove('hidden');
            
            updateSearchInputStatus();
            renderHeaders1();
            runGlobalSearch();
        }

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            statusMessage.textContent = "Reading file...";
            const fileName = file.name || "";
            const isCsv = fileName.toLowerCase().endsWith('.csv');

            if (isCsv && typeof Papa !== 'undefined') {
                Papa.parse(file, {
                    header: false,
                    skipEmptyLines: 'greedy',
                    complete: function(results) {
                        if (results.data && results.data.length > 0) {
                            processParsedData1(results.data, fileName);
                        } else {
                            // Fallback to array buffer parser
                            readWithSheetJS(file);
                        }
                    },
                    error: function(err) {
                        console.warn("PapaParse error, trying SheetJS:", err);
                        readWithSheetJS(file);
                    }
                });
            } else {
                readWithSheetJS(file);
            }

            function readWithSheetJS(f) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array', cellDates: true, raw: false });
                        
                        if (!workbook.SheetNames || workbook.SheetNames.length === 0) {
                            statusMessage.textContent = "The file appears to be empty.";
                            return;
                        }

                        // Try first non-empty sheet
                        let rows = [];
                        for (let s of workbook.SheetNames) {
                            const ws = workbook.Sheets[s];
                            const parsed = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "" });
                            if (parsed && parsed.length > 0) {
                                rows = parsed;
                                break;
                            }
                        }

                        processParsedData1(rows, fileName);
                    } catch (error) {
                        statusMessage.textContent = "Error parsing file.";
                        console.error(error);
                    }
                };
                reader.readAsArrayBuffer(f);
            }
        });

        function renderHeaders1() {
            tableHeader.innerHTML = '';
            const headers = fileData1[0] || [];
            const colCount = Math.min(headers.length, 5);

            for (let i = 0; i < colCount; i++) {
                const th = document.createElement('th');
                const widthClass = i === 4 ? "max-w-[220px]" : "max-w-[150px]";
                th.className = `px-4 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider ${widthClass} break-words`;
                th.textContent = headers[i] || `Column ${i + 1}`;
                tableHeader.appendChild(th);
            }
        }

        function displayResults1(rows) {
            const fragment = document.createDocumentFragment();
            matchCount.classList.remove('hidden');
            matchCount.textContent = `Matches found: ${rows.length}`;

            if (rows.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="5" class="px-4 py-4 text-center text-gray-500">No matching data found.</td></tr>`;
                return;
            }

            const colCount = Math.min(fileData1[0].length, 5);

            rows.forEach(row => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-50 transition-colors";
                
                for (let i = 0; i < colCount; i++) {
                    const td = document.createElement('td');
                    const widthClass = i === 4 ? "max-w-[220px]" : "max-w-[150px]";
                    td.className = `px-4 py-3 text-gray-700 whitespace-normal break-all normal-case ${widthClass} align-middle`;
                    
                    const cellValue = row[i] !== undefined ? String(row[i]).trim() : "";

                    if (i === 3 && cellValue !== "") {
                        const wrapper = document.createElement('div');
                        wrapper.className = "block space-y-1.5 w-full";
                        
                        const textSpan = document.createElement('span');
                        textSpan.className = "block text-xs md:text-sm text-gray-800 break-words whitespace-normal leading-relaxed";
                        textSpan.textContent = cellValue;
                        
                        const copyBtn = document.createElement('button');
                        copyBtn.className = "inline-flex items-center bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-[10px] font-bold px-2 py-0.5 rounded border border-indigo-200 transition shadow-sm";
                        copyBtn.textContent = "Copy";
                        copyBtn.onclick = () => executeCopy(cellValue, copyBtn);
                        
                        wrapper.appendChild(textSpan);
                        wrapper.appendChild(copyBtn);
                        td.appendChild(wrapper);
                    } else if (i === 4 && cellValue !== "") {
                        const cellContainer = document.createElement('div');
                        cellContainer.className = "flex flex-col gap-2 w-full";
                        const items = cellValue.split(',').map(item => item.trim()).filter(item => item !== "");
                        const spaceSeparatedText = items.join(' ');

                        const copyAllBtn = document.createElement('button');
                        copyAllBtn.className = "w-full text-center bg-slate-800 hover:bg-slate-900 text-white text-[9px] uppercase tracking-wider font-extrabold py-1 px-2 rounded transition shadow-sm";
                        copyAllBtn.textContent = "Copy All (Spaced)";
                        copyAllBtn.onclick = () => executeCopy(spaceSeparatedText, copyAllBtn);
                        cellContainer.appendChild(copyAllBtn);

                        const itemsWrapper = document.createElement('div');
                        itemsWrapper.className = "flex flex-wrap gap-1.5 w-full";

                        items.forEach(item => {
                            const chip = document.createElement('div');
                            chip.className = "inline-flex items-center bg-gray-100 border border-gray-200 rounded pl-2 pr-1 py-0.5 max-w-full text-[11px] font-medium break-all";
                            const itemText = document.createElement('span');
                            itemText.className = "truncate mr-1.5 text-gray-800";
                            itemText.textContent = item;
                            const itemCopyBtn = document.createElement('button');
                            itemCopyBtn.className = "bg-white hover:bg-indigo-50 text-indigo-600 border border-gray-300 rounded px-1 py-0.5 text-[9px] font-bold shadow-sm transition shrink-0";
                            itemCopyBtn.textContent = "Copy";
                            itemCopyBtn.onclick = () => executeCopy(item, itemCopyBtn);

                            chip.appendChild(itemText);
                            chip.appendChild(itemCopyBtn);
                            itemsWrapper.appendChild(chip);
                        });
                        cellContainer.appendChild(itemsWrapper);
                        td.appendChild(cellContainer);
                    } else {
                        td.className += " break-words";
                        td.textContent = cellValue;
                    }
                    tr.appendChild(td);
                }
                fragment.appendChild(tr);
            });

            tableBody.innerHTML = '';
            tableBody.appendChild(fragment);
        }

        fileInput2.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            statusMessage2.textContent = "Reading file setup...";
            const reader = new FileReader();

            reader.onload = (e) => {
                try {
                    const data = new Uint8Array(e.target.result);
                    fileWorkbook2 = XLSX.read(data, { type: 'array', cellDates: true, raw: false });
                    cachedSheets2 = {};
                    statusMessage2.textContent = `Loaded: ${file.name}`;
                    
                    tabCheckboxes.innerHTML = '';
                    fileWorkbook2.SheetNames.forEach((sheetName, index) => {
                        const label = document.createElement('label');
                        label.className = "inline-flex items-center space-x-2 bg-gray-50 hover:bg-gray-100 border border-gray-200 rounded-md px-3 py-1.5 cursor-pointer text-xs font-medium select-none";
                        
                        const checkbox = document.createElement('input');
                        checkbox.type = 'checkbox';
                        checkbox.value = sheetName;
                        checkbox.className = "rounded text-emerald-600 focus:ring-emerald-500 w-4 h-4";
                        if (index === 0) checkbox.checked = true; 

                        checkbox.addEventListener('change', runGlobalSearch);

                        const text = document.createElement('span');
                        text.textContent = sheetName;

                        label.appendChild(checkbox);
                        label.appendChild(text);
                        tabCheckboxes.appendChild(label);
                    });

                    tabSelectionContainer.classList.remove('hidden');
                    file2ResultsContainer.classList.remove('hidden');
                    
                    updateSearchInputStatus();
                    runGlobalSearch();
                } catch (error) {
                    statusMessage2.textContent = "Error parsing File 2.";
                    console.error(error);
                }
            };
            reader.readAsArrayBuffer(file);
        });

                const clearSearchBtn = document.getElementById('clearSearchBtn');
        const searchAllColsCheckbox = document.getElementById('searchAllColsCheckbox');
        const selectAllTabsBtn = document.getElementById('selectAllTabsBtn');
        const deselectAllTabsBtn = document.getElementById('deselectAllTabsBtn');

        if (clearSearchBtn) {
            clearSearchBtn.addEventListener('click', () => {
                searchInput.value = '';
                clearSearchBtn.classList.add('hidden');
                searchInput.focus();
                runGlobalSearch();
            });
        }

        if (searchAllColsCheckbox) {
            searchAllColsCheckbox.addEventListener('change', runGlobalSearch);
        }

        if (selectAllTabsBtn) {
            selectAllTabsBtn.addEventListener('click', () => {
                tabCheckboxes.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = true);
                runGlobalSearch();
            });
        }

        if (deselectAllTabsBtn) {
            deselectAllTabsBtn.addEventListener('click', () => {
                tabCheckboxes.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);
                runGlobalSearch();
            });
        }

        // Live search: input event triggers immediate/debounced search
        searchInput.addEventListener('input', () => {
            if (clearSearchBtn) {
                if (searchInput.value.trim().length > 0) {
                    clearSearchBtn.classList.remove('hidden');
                } else {
                    clearSearchBtn.classList.add('hidden');
                }
            }
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(runGlobalSearch, 80);
        });

        // Also trigger immediately on Enter or Escape
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                searchInput.value = '';
                if (clearSearchBtn) clearSearchBtn.classList.add('hidden');
                runGlobalSearch();
            } else if (e.key === 'Enter') {
                clearTimeout(searchTimeout);
                runGlobalSearch();
            }
        });

        // Normalizer helper for robust multi-keyword matching
        function cleanString(val) {
            if (val === undefined || val === null) return "";
            return String(val).toLowerCase().trim().replace(/\s+/g, ' ');
        }

        function rowMatchesTokens(row, tokens, searchAll, targetIndices) {
            if (!tokens || tokens.length === 0) return true;
            if (!row || !Array.isArray(row)) return false;

            let rowText = "";
            if (searchAll) {
                rowText = row.map(cell => cleanString(cell)).join(" ");
            } else {
                rowText = targetIndices.map(idx => cleanString(row[idx])).join(" ");
            }

            // Every typed token must match somewhere in the row text (AND matching)
            return tokens.every(token => rowText.includes(token));
        }

        function runGlobalSearch() {
            const rawTerm = searchInput.value.toLowerCase().trim();
            // Split search query into tokens so multiple words find matches regardless of order
            const tokens = rawTerm ? rawTerm.split(/\s+/).filter(Boolean) : [];
            const searchAll = searchAllColsCheckbox ? searchAllColsCheckbox.checked : false;

            // 1. Search and render File 1
            if (fileData1 && fileData1.length > 0) {
                const dataRows1 = fileData1.slice(1);
                if (tokens.length === 0) {
                    displayResults1(dataRows1);
                } else {
                    // Target: Column 1 (index 0) by default, or all columns if checked
                    const filteredRows1 = dataRows1.filter(row => rowMatchesTokens(row, tokens, searchAll, [0]));
                    displayResults1(filteredRows1);
                }
            }

            // 2. Search and render File 2
            if (fileWorkbook2) {
                const checkedBoxes = tabCheckboxes.querySelectorAll('input[type="checkbox"]:checked');
                
                if (checkedBoxes.length === 0) {
                    file2ResultsContainer.innerHTML = `<div class="text-sm text-center text-gray-400 py-4 bg-white border border-gray-200 rounded-lg">Select at least one tab to view matches.</div>`;
                    return;
                }

                const fragmentContainer = document.createDocumentFragment();

                checkedBoxes.forEach(box => {
                    const sheetName = box.value;
                    
                    if (!cachedSheets2[sheetName]) {
                        const worksheet = fileWorkbook2.Sheets[sheetName];
                        cachedSheets2[sheetName] = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: "" });
                    }
                    
                    const sheetData = cachedSheets2[sheetName];
                    if (!sheetData || sheetData.length === 0) return;

                    const headers = sheetData[0] || [];
                    const dataRows2 = sheetData.slice(1);

                    let matchedRows2 = dataRows2;
                    if (tokens.length > 0) {
                        // Target: Columns 3 & 4 (indices 2 and 3) by default, or all columns if checked
                        matchedRows2 = dataRows2.filter(row => rowMatchesTokens(row, tokens, searchAll, [2, 3]));
                    }

                    renderFile2TabBlock(sheetName, headers, matchedRows2, fragmentContainer);
                });

                file2ResultsContainer.innerHTML = '';
                file2ResultsContainer.appendChild(fragmentContainer);
            }
        }
        
        function renderFile2TabBlock(sheetName, headers, rows, parentFragment) {
            const blockContainer = document.createElement('div');
            blockContainer.className = "bg-white border border-gray-200 rounded-xl overflow-hidden shadow-sm";

            const headerBlock = document.createElement('div');
            headerBlock.className = "bg-emerald-700 text-white px-4 py-2 text-sm font-bold flex justify-between items-center";
            headerBlock.innerHTML = `<span>Tab Area: ${sheetName}</span> <span class="bg-emerald-900 text-emerald-100 text-xs px-2 py-0.5 rounded-full">Matches: ${rows.length}</span>`;
            blockContainer.appendChild(headerBlock);

            if (rows.length === 0) {
                const emptyMsg = document.createElement('div');
                emptyMsg.className = "p-4 text-sm text-gray-500 text-center";
                emptyMsg.textContent = "No keyword match discovered in Columns 3 or 4 within this tab.";
                blockContainer.appendChild(emptyMsg);
                parentFragment.appendChild(blockContainer);
                return;
            }

            const tableWrapper = document.createElement('div');
            tableWrapper.className = "overflow-x-auto";
            
            const table = document.createElement('table');
            table.className = "w-full table-fixed divide-y divide-gray-200 text-xs text-left";

            const thead = document.createElement('thead');
            thead.className = "bg-gray-50";
            const trHead = document.createElement('tr');
            
            const targetColCount = Math.min(headers.length, 4);
            for (let i = 0; i < targetColCount; i++) {
                const th = document.createElement('th');
                th.className = "px-3 py-2 text-gray-500 font-bold uppercase tracking-wider max-w-[140px] break-words";
                th.textContent = headers[i] || `Col ${i + 1}`;
                trHead.appendChild(th);
            }
            thead.appendChild(trHead);
            table.appendChild(thead);

            const tbody = document.createElement('tbody');
            tbody.className = "divide-y divide-gray-200 bg-white";

            rows.forEach(row => {
                const trRow = document.createElement('tr');
                trRow.className = "hover:bg-gray-50 transition-colors";
                
                for (let i = 0; i < targetColCount; i++) {
                    const td = document.createElement('td');
                    td.className = "px-3 py-2 text-gray-700 max-w-[140px] break-words align-middle whitespace-normal";
                    
                    if ((i === 2 || i === 3) && row[i] !== undefined) {
                        td.className += " bg-amber-50/60 font-medium";
                    }
                    
                    td.textContent = row[i] !== undefined ? String(row[i]).trim() : "";
                    trRow.appendChild(td);
                }
                tbody.appendChild(trRow);
            });

            table.appendChild(tbody);
            tableWrapper.appendChild(table);
            blockContainer.appendChild(tableWrapper);
            parentFragment.appendChild(blockContainer);
        }

        function executeCopy(text, buttonElement) {
            navigator.clipboard.writeText(text).then(() => {
                const originalText = buttonElement.textContent;
                buttonElement.textContent = "Copied!";
                buttonElement.classList.add('bg-green-100', 'text-green-800', 'border-green-300');
                
                setTimeout(() => {
                    buttonElement.textContent = originalText;
                    buttonElement.classList.remove('bg-green-100', 'text-green-800', 'border-green-300');
                }, 1000);
            });
        }
    </script>
</body>
</html>
